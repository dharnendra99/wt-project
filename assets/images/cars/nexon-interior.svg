<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171c"/>
      <stop offset="100%" stop-color="#242b35"/>
    </linearGradient>
    <linearGradient id="carPaint" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#374151" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <circle cx="400" cy="225" r="280" fill="#0f172a" opacity="0.08" filter="url(#glow)"/>
  
  <!-- Grid floor lines -->
  <path d="M 50 380 L 750 380 M 100 410 L 700 410" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="400" cy="370" rx="310" ry="22" fill="#000000" opacity="0.6"/>

  <!-- Car Silhouette / Body -->
  <g transform="translate(100, 110)">
    <!-- Main Body Shell -->
    <path d="M 40 190 Q 60 140 120 125 L 200 95 Q 260 55 350 55 L 430 55 Q 490 60 520 120 L 580 150 Q 600 180 590 205 L 560 215 L 490 215 Q 470 170 410 170 Q 350 170 330 215 L 230 215 Q 210 170 150 170 Q 90 170 70 215 L 40 215 Z" fill="url(#carPaint)"/>
    
    <!-- Cabin Windows / Glass -->
    <path d="M 215 95 L 340 68 L 420 68 Q 460 72 485 118 L 375 118 Z" fill="url(#glass)"/>
    <path d="M 370 118 L 480 118 L 460 120 Z" fill="#ffffff" opacity="0.2"/>
    
    <!-- Headlights (Aggressive red/white LED DRL) -->
    <polygon points="560,155 585,160 570,175 550,170" fill="#f8fafc" filter="url(#glow)"/>
    <polygon points="45,170 35,185 55,185 65,170" fill="#ef4444" filter="url(#glow)"/>

    <!-- Wheels & Rims -->
    <!-- Rear Wheel -->
    <circle cx="150" cy="215" r="48" fill="#0f172a" stroke="#475569" stroke-width="6"/>
    <circle cx="150" cy="215" r="32" fill="#1e293b" stroke="#cbd5e1" stroke-width="4"/>
    <circle cx="150" cy="215" r="14" fill="#d90000"/>

    <!-- Front Wheel -->
    <circle cx="410" cy="215" r="48" fill="#0f172a" stroke="#475569" stroke-width="6"/>
    <circle cx="410" cy="215" r="32" fill="#1e293b" stroke="#cbd5e1" stroke-width="4"/>
    <circle cx="410" cy="215" r="14" fill="#d90000"/>
  </g>

  <!-- Watermark / Brand Badge Overlay -->
  <rect x="30" y="30" width="130" height="32" rx="4" fill="#d90000"/>
  <text x="95" y="52" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="1">10.25" TOUCHSCREEN</text>

  <!-- Car Title & Price Badge -->
  <text x="30" y="405" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24">Tata Nexon Digital Cockpit</text>
  <text x="770" y="405" fill="#d90000" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" text-anchor="end">Ventilated Seats</text>
</svg>