<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="newsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d90000"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#newsBg)"/>
  
  <!-- Speed Lines & Shapes -->
  <path d="M -50 0 L 250 0 L 150 450 L -150 450 Z" fill="#d90000" opacity="0.12"/>
  <path d="M 650 0 L 950 0 L 850 450 L 550 450 Z" fill="#ffffff" opacity="0.04"/>

  <!-- Center Automotive Concept Graphic -->
  <g transform="translate(180, 70)">
    <circle cx="220" cy="120" r="110" fill="url(#redAccent)" opacity="0.15"/>
    <path d="M 40 180 Q 90 80 220 70 Q 360 80 410 180 Z" fill="none" stroke="#d90000" stroke-width="5"/>
    <path d="M 120 180 Q 160 110 220 105 Q 280 110 320 180 Z" fill="#ffffff" opacity="0.1"/>
    <circle cx="120" cy="180" r="30" fill="#3f3f46" stroke="#d90000" stroke-width="3"/>
    <circle cx="320" cy="180" r="30" fill="#3f3f46" stroke="#d90000" stroke-width="3"/>
  </g>

  <!-- Category Tag -->
  <rect x="40" y="40" width="130" height="34" rx="4" fill="#d90000"/>
  <text x="105" y="62" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" text-anchor="middle" letter-spacing="1">CAR NEWS</text>

  <!-- Trending Badge -->
  <rect x="760" y="40" width="100" height="30" rx="15" fill="#3f3f46" transform="translate(-100, 0)"/>
  <text x="710" y="60" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" text-anchor="middle">★ 184K VIEWS</text>

  <!-- News Headline banner -->
  <rect x="0" y="320" width="800" height="130" fill="#09090b" opacity="0.95"/>
  <rect x="0" y="318" width="800" height="2" fill="#d90000"/>
  <text x="40" y="365" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22">Tata Curvv EV Launched: Starts at Rs 17.49L</text>
  <text x="40" y="405" fill="#a1a1aa" font-family="'Segoe UI', Roboto, sans-serif" font-size="14">AutoPulse Exclusive • Verified Road Test &amp; Insider Report</text>
</svg>